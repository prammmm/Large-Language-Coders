experiment:
  id: EXP-B-01

seed: 42

paths:
  root: .
  raw_dir: datasets
  interim_dir: data/interim
  processed_dir: data/processed
  splits_dir: data/splits
  output_dir: output
  runs_dir: artifacts

preprocess:
  splits: [train, test]
  read_block_bytes: 16777216
  batch_rows: 100000
  n_workers: 6

split:
  val_fraction: 0.10

blocking:
  top_k: 20
  encode_chunk_rows: 250000
  max_raw_pairs_per_chunk: 4000000
  strip_leading_zeros: false
  passes:
    exact_name:
      enabled: true
      max_block_size: 50
      weight: 2.0
    addr_num_word:
      enabled: true
      max_block_size: 50
      max_nums: 2
      max_words: 4
      word_max_df: 500000
      weight: 1.0
    addr_rare_word:
      enabled: true
      max_df: 20
      weight: 1.0
    name_token:
      enabled: false
      max_df: 200
      weight: 1.0
    exact_core:
      enabled: false
      max_block_size: 50
      weight: 2.0
    sorted_core:
      enabled: false
      max_block_size: 50
      weight: 2.0

features:
  strip_leading_zeros: false
  extra: []

scoring:
  tag: scored
  feature_batch_pairs: 500000
  rapidfuzz_workers: 8
  store_features:
    train: true
    test: false

matcher:
  type: weighted_rule
  weights:
    name_core_jaccard: 2.0
    name_ratio: 1.5
    name_token_set: 1.0
    name_concat_jw: 1.0
    name_norm_eq: 0.5
    addr_jaccard: 1.5
    addr_ratio: 1.0
    addr_token_set: 0.5
    addr_num_jaccard: 1.5
    addr_shared_useful: 0.5
  caps:
    addr_shared_useful: 3
  features: [name_norm_eq, name_core_eq, name_core_jaccard, name_shared_tokens, name_ratio, name_token_set,
             name_concat_jw, name_len_diff, addr_norm_eq, addr_jaccard, addr_ratio, addr_token_set,
             addr_num_jaccard, addr_num_shared, addr_shared_useful, addr_any_empty, cheap_score, cheap_rank,
             "name_core_jaccard*addr_num_jaccard", "name_ratio*addr_token_set"]
  model_path: null

fit:
  max_train_s1: 200000
  inner_tune_fraction: 0.2
  l2: 0.0001
  max_iter: 50

decision:
  threshold: 0.75
  use_tuned_threshold: true

tuning:
  thresholds: {start: 0.30, stop: 0.95, step: 0.01}
  recall_at_k: [1, 3, 5, 10, 20]
  block_eval_k: [10, 20, 30, 50]

train:
  max_val_s1: null

submit:
  strict_validate: true
