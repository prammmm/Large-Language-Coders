inherit: exp_f01b_conflicts_zeros.yaml

experiment:
  id: EXP-M-03

scoring:
  tag: scored_EXP-M-03
  eval_source_tag: scored_EXP-F-01b

matcher:
  type: lightgbm

fit:
  max_train_s1: 200000
  reuse_fit_parts: scored_EXP-F-01b_fit
  dev_subsample_s1: null

lightgbm:
  num_boost_round: 1000
  early_stopping_rounds: 50
  params:
    objective: binary
    learning_rate: 0.05
    num_leaves: 31
    max_depth: 8
    min_data_in_leaf: 100
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 1
    lambda_l2: 1.0
    num_threads: 8
    seed: 42
    deterministic: true
    force_row_wise: true
    verbosity: -1

decision:
  threshold_from: model
  threshold: 0.5
