inherit: exp_s04_stage1_b10.yaml

experiment:
  id: EXP-S-04
  allowed_stages: [submit]

paths:
  output_dir: artifacts/EXP-S-04/output

scoring:
  tag: scored_EXP-S-04
  eval_source_tag: scored_EXP-S-04

matcher:
  type: lightgbm
  model_path: artifacts/EXP-S-04/model.json

stage2:
  stage1_run: EXP-S-04
  train_tag: forensic_alltrain_S04
  xlit_map: artifacts/EXP-S-04/xlit_map.json
  min_score: 0.02
  peers: 3
  inner_fraction: 0.2
  chunk_pairs: 1500000
  workers: 8
  thresholds: {start: 0.30, stop: 0.90, step: 0.01}
  lightgbm:
    num_boost_round: 2000
    early_stopping_rounds: 50
    params: {learning_rate: 0.05, num_leaves: 63, min_data_in_leaf: 200, feature_fraction: 0.9,
             bagging_fraction: 0.8, bagging_freq: 1, lambda_l2: 1.0, seed: 42, num_threads: 8}
  add_floor: .inf
