# EXP-S-04: S-03-style veto REFITTED on the EXP-S-04 (B-10 blocker) stage-1 outputs. Same stage-2 recipe, features and
# hyperparameters as S-03 (copied verbatim); a NEW stage-2 model is fitted (no model_from / features_from: S-03 weights are
# never reused). VETO ONLY: final = (S-04 stage 1 + D-01) AND stage 2 (add_floor .inf) -> it can never add a pair.
inherit: exp_s04_stage1_b10.yaml

experiment:
  id: EXP-S-04
  allowed_stages: [submit]      # run_baseline guard: stage 1 is frozen once fitted; use ber.pipeline.run_stage2

paths:
  output_dir: experiments/runs/EXP-S-04/output   # never the production output/ folder

scoring:
  tag: scored_EXP-S-04          # stage-1 TEST scored parts of S-04 stage 1
  eval_source_tag: scored_EXP-S-04

matcher:
  type: lightgbm
  model_path: experiments/runs/EXP-S-04/model.json   # the fresh S-04 stage-1 model (its inner-split threshold = control)

stage2:
  stage1_run: EXP-S-04
  train_tag: forensic_alltrain_S04          # S-04 stage-1 scores of ALL train S1 (full competition; out of sample for E)
  xlit_map: experiments/runs/EXP-S-04/xlit_map.json
  min_score: 0.02
  peers: 3
  inner_fraction: 0.2
  chunk_pairs: 1500000
  workers: 8
  thresholds: {start: 0.30, stop: 0.90, step: 0.01}
  lightgbm:
    num_boost_round: 2000
    early_stopping_rounds: 50
    params: {learning_rate: 0.05, num_leaves: 63, min_data_in_leaf: 200, feature_fraction: 0.9,
             bagging_fraction: 0.8, bagging_freq: 1, lambda_l2: 1.0, seed: 42, num_threads: 8}
  add_floor: .inf               # veto only
