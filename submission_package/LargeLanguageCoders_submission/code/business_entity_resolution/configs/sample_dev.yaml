# DEV CONFIG: identical to baseline_v0.yaml but runs on the ~2% sample built by
# scripts/make_sample_data.py. Results are NOT full-data benchmarks.
# Every tunable of the baseline lives here. Change values here, not in source code.

experiment:
  id: EXP-B-01-sample

seed: 42

paths:
  root: .
  raw_dir: data/sample/datasets  # sample built from datasets/ (read-only)
  interim_dir: data/sample/interim
  processed_dir: data/sample/processed
  splits_dir: data/sample/splits
  output_dir: data/sample/output  # never the real output/ folder
  runs_dir: experiments/runs

preprocess:
  splits: [train, test]
  read_block_bytes: 16777216     # pyarrow CSV block size (16 MB)
  batch_rows: 100000             # rows per normalization batch
  n_workers: 6                   # normalization processes (RAM ~ n_workers x ~150 MB)

split:
  val_fraction: 0.10             # stratified by country x match-count bucket, seed above

blocking:
  top_k: 20                      # candidates kept per S1 after the cheap-score ranking
  encode_chunk_rows: 250000      # records per token-encoding chunk (blocking index build)
  max_raw_pairs_per_chunk: 4000000   # memory guard: S1 chunk size (raw expansion); lower = less RAM, more column reads
  passes:
    exact_name:                  # Block A: identical name_norm
      enabled: true
      max_block_size: 50         # skip names shared by > 50 pool records (generic names)
      weight: 2.0
    addr_num_word:               # Block B1: (numeric token, useful word) inside the address
      enabled: true
      max_block_size: 50
      max_nums: 2                # rarest numeric tokens per record
      max_words: 4               # rarest useful words per record
      word_max_df: 500000        # words above this pool DF are never used
      weight: 1.0
    addr_rare_word:              # Block B2: a rare useful address word on its own
      enabled: true
      max_df: 20
      weight: 1.0
    name_token:                  # rare name_core token -- OFF in v0 (candidate for EXP-B-02)
      enabled: false
      max_df: 200
      weight: 1.0

scoring:
  feature_batch_pairs: 500000    # pairs per feature batch (RAM ~ 0.5-1 GB per batch)
  rapidfuzz_workers: 8           # threads for rapidfuzz cpdist
  store_features:                # persist feature columns next to scores (for later LR/GBDT work)
    train: true
    test: false

matcher:                         # Baseline-1 weighted similarity rule; score in [0, 1]
  weights:
    name_core_jaccard: 2.0
    name_ratio: 1.5
    name_token_set: 1.0
    name_concat_jw: 1.0
    name_norm_eq: 0.5
    addr_jaccard: 1.5
    addr_ratio: 1.0
    addr_token_set: 0.5
    addr_num_jaccard: 1.5
    addr_shared_useful: 0.5
  caps:
    addr_shared_useful: 3        # count feature -> min(count / 3, 1)

decision:
  threshold: 0.75                # conservative default, used if no tuned threshold exists
  use_tuned_threshold: true      # use experiments/runs/<id>/tuned_threshold.json when present

tuning:
  thresholds: {start: 0.30, stop: 0.95, step: 0.01}
  recall_at_k: [1, 3, 5, 10, 20]

train:
  max_val_s1: null               # null = all validation S1; or e.g. 20000 for a quick dev run

submit:
  strict_validate: true
