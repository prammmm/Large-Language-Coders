# EXP-B-01: Submission-1 baseline (blocking V0 -> weighted similarity rule -> global threshold)
# Every tunable of the baseline lives here. Change values here, not in source code.

experiment:
  id: EXP-B-01

seed: 42

paths:
  root: .
  raw_dir: datasets              # READ-ONLY organizer data
  interim_dir: data/interim      # typed Parquet copies
  processed_dir: data/processed  # normalized views, scored candidate pairs
  splits_dir: data/splits        # frozen validation split
  output_dir: output             # final TSVs
  runs_dir: experiments/runs     # per-experiment metrics / tuned threshold

preprocess:
  splits: [train, test]
  read_block_bytes: 16777216     # pyarrow CSV block size (16 MB)
  batch_rows: 100000             # rows per normalization batch
  n_workers: 6                   # normalization processes (RAM ~ n_workers x ~150 MB)

split:
  val_fraction: 0.10             # stratified by country x match-count bucket, seed above

blocking:
  top_k: 20                      # candidates kept per S1 after the cheap-score ranking
  encode_chunk_rows: 250000      # records per token-encoding chunk (blocking index build)
  max_raw_pairs_per_chunk: 4000000   # memory guard: S1 chunk size (raw expansion); lower = less RAM, more column reads
  strip_leading_zeros: false     # EXP-B-02 (C): "04126" == "4126" for address-number keys
  passes:
    exact_name:                  # Block A: identical name_norm
      enabled: true
      max_block_size: 50         # skip names shared by > 50 pool records (generic names)
      weight: 2.0
    addr_num_word:               # Block B1: (numeric token, useful word) inside the address
      enabled: true
      max_block_size: 50
      max_nums: 2                # rarest numeric tokens per record
      max_words: 4               # rarest useful words per record
      word_max_df: 500000        # words above this pool DF are never used
      weight: 1.0
    addr_rare_word:              # Block B2: a rare useful address word on its own
      enabled: true
      max_df: 20
      weight: 1.0
    name_token:                  # rare name_core token -- OFF in v0 (candidate for EXP-B-02 D)
      enabled: false
      max_df: 200
      weight: 1.0
    exact_core:                  # EXP-B-02 (A): identical name_core (legal forms removed) -- OFF in v0
      enabled: false
      max_block_size: 50
      weight: 2.0
    sorted_core:                 # EXP-B-02 (B): identical sorted name_core tokens -- OFF in v0
      enabled: false
      max_block_size: 50
      weight: 2.0

features:
  strip_leading_zeros: false     # compare address numbers after removing leading zeros
  extra: []                      # EXP-F-01 options: num_conflict, legal_form_conflict

scoring:
  tag: scored                    # data/processed/<split>/<tag>/ (EXP-B-01 used "scored")
  feature_batch_pairs: 500000    # pairs per feature batch (RAM ~ 0.5-1 GB per batch)
  rapidfuzz_workers: 8           # threads for rapidfuzz cpdist
  store_features:                # persist feature columns next to scores (for later LR/GBDT work)
    train: true
    test: false

matcher:                         # Baseline-1 weighted similarity rule; score in [0, 1]
  type: weighted_rule            # weighted_rule (deterministic, not trained) | logistic (fitted by `fit`)
  weights:
    name_core_jaccard: 2.0
    name_ratio: 1.5
    name_token_set: 1.0
    name_concat_jw: 1.0
    name_norm_eq: 0.5
    addr_jaccard: 1.5
    addr_ratio: 1.0
    addr_token_set: 0.5
    addr_num_jaccard: 1.5
    addr_shared_useful: 0.5
  caps:
    addr_shared_useful: 3        # count feature -> min(count / 3, 1)
  # Used only when type: logistic (EXP-M-02). "a*b" = product feature.
  features: [name_norm_eq, name_core_eq, name_core_jaccard, name_shared_tokens, name_ratio, name_token_set,
             name_concat_jw, name_len_diff, addr_norm_eq, addr_jaccard, addr_ratio, addr_token_set,
             addr_num_jaccard, addr_num_shared, addr_shared_useful, addr_any_empty, cheap_score, cheap_rank,
             "name_core_jaccard*addr_num_jaccard", "name_ratio*addr_token_set"]
  model_path: null               # default experiments/runs/<id>/model.json

fit:                             # `fit` stage (logistic only): TRAIN-fold S1s, never validation
  max_train_s1: 200000           # seeded sample of train-fold S1 (null = all ~1.99M)
  inner_tune_fraction: 0.2       # share of fit S1s held out to tune the threshold
  l2: 0.0001
  max_iter: 50

decision:
  threshold: 0.75                # conservative default, used if no tuned threshold exists
  use_tuned_threshold: true      # use experiments/runs/<id>/tuned_threshold.json when present

tuning:
  thresholds: {start: 0.30, stop: 0.95, step: 0.01}
  recall_at_k: [1, 3, 5, 10, 20]
  block_eval_k: [10, 20, 30, 50]

train:
  max_val_s1: null               # null = all validation S1; or e.g. 20000 for a quick dev run

submit:
  strict_validate: true
