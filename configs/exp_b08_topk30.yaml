# EXP-B-08: candidate list top-K 20 -> 30 on the EXP-B-06 blocker (EXP-S-02 error budget: never-retrieved
# true pairs are the largest bucket; ~35% of them are generated by the blocker but ranked beyond 20).
# ONE change: blocking.top_k 30. Every key, cap, weight, the cross-script map rule and the features are
# unchanged. Because candidate membership and the blocker-derived features (cheap_rank range, cheap_score
# context) change, the stage-1 LightGBM is RETRAINED on B-08 candidates (DEC-017), never the B-06 model.
# Decision: inner-split threshold of the new model + D-01 (same protocol as B-06). Control: EXP-B-06 + D-01 @ 0.67.
inherit: exp_b06_name_pair.yaml

experiment:
  id: EXP-B-08

paths:
  output_dir: experiments/runs/EXP-B-08/output   # never the production output/ folder

blocking:
  top_k: 30

matcher:
  model_path: null        # -> experiments/runs/EXP-B-08/model.json (this experiment's own fit)

scoring:
  tag: scored_EXP-B-08    # fit parts: scored_EXP-B-08_fit; nothing is read from EXP-B-06 folders
  eval_source_tag: null

tuning:
  recall_at_k: [1, 3, 5, 10, 20, 30]
